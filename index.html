<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 塞爆購物車</title>
  <meta name="description" content="想吃的、想買的這裡都點得到｜我要買・想了解 🛒">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(255, 221, 120, .38), transparent 30%),
        linear-gradient(180deg, #fffaf0 0%, #fff4cf 100%);
      color: #2b2418;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.9);
      border-radius: 28px;
      padding: 34px 24px;
      box-shadow: 0 14px 40px rgba(95, 69, 0, .12);
      text-align: center;
      border: 1px solid rgba(255, 216, 106, .55);
    }
    .crown { font-size: 42px; margin-bottom: 6px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p {
      margin: 0 0 26px;
      color: #6d604a;
      font-size: 17px;
      line-height: 1.8;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 17px 18px;
      border-radius: 16px;
      background: #17130d;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .small {
      margin-top: 16px;
      font-size: 13px;
      color: #9a8b72;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="crown">👑✨</div>
    <h1>塞爆購物車</h1>
    <p>喜歡的、想買的<br>這裡都點得到 🛒</p>

    <a class="btn"
       href="https://script.google.com/macros/s/AKfycbz3cGUC6hsUJfhKJJ-kCznEaYtwiBKcTPpBO-EK40ZB7q0cp4sHjhUye-zN4p1bcQ8s/exec"
       target="_blank"
       rel="noopener">
      🛒 進入購物車
    </a>

    <div class="small">每檔期優惠不同・Queena 會盡快回覆你唷</div>
  </main>
</body>
</html>
